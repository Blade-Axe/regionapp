<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				var t = null;
				try {
					t = localStorage.getItem("theme");
				} catch (e) {}
				if (t !== "dark" && t !== "light") {
					t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
				}
				document.documentElement.dataset.theme = t;
			})();
		</script>
		<style>
			html[data-theme="dark"] {
				background-color: #242424;
				color-scheme: dark;
			}
			html[data-theme="light"] {
				background-color: #ffffff;
				color-scheme: light;
			}
		</style>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://mcicons.mumd.dev/releases/v2.1.1/css/all.css" integrity="sha384-Op68iRHwtX3ZkkaCqnN0YCSj/K/jufnhP46ESGCGFGfmOVOATxdc0kmgUXFRXys0" crossorigin="anonymous">
		<title>The Region</title>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
